name: Fix Step 8 adapter

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair duplicate adapter and lifecycle call
        shell: python
        run: |
          from pathlib import Path

          path = Path('development-audit/EDB_DISPLAYBOARD_LIVE.js')
          text = path.read_text(encoding='utf-8')
          needle = 'function getEDBBookingForNewUI(bookingId) {'
          positions = []
          start = 0
          while True:
              p = text.find(needle, start)
              if p < 0:
                  break
              positions.append(p)
              start = p + len(needle)

          if len(positions) != 2:
              raise SystemExit(f'Expected exactly 2 adapter definitions before repair; found {len(positions)}')

          p = positions[1]
          brace = text.find('{', p + len('function getEDBBookingForNewUI(bookingId)'))
          if brace < 0:
              raise SystemExit('Could not locate second adapter opening brace')

          depth = 0
          i = brace
          state = 'code'
          quote = None
          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ''
              if state == 'code':
                  if ch == '/' and nxt == '/':
                      state = 'line'; i += 2; continue
                  if ch == '/' and nxt == '*':
                      state = 'block'; i += 2; continue
                  if ch in ('"', "'", '`'):
                      quote = ch; state = 'string'; i += 1; continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in '\r\n':
                              end += 1
                          text = text[:p] + text[end:]
                          break
                  i += 1
              elif state == 'line':
                  if ch in '\r\n': state = 'code'
                  i += 1
              elif state == 'block':
                  if ch == '*' and nxt == '/':
                      state = 'code'; i += 2
                  else:
                      i += 1
              else:
                  if ch == '\\':
                      i += 2
                  elif ch == quote:
                      state = 'code'; i += 1
                  else:
                      i += 1
          else:
              raise SystemExit('Could not find matching brace for second adapter')

          old = 'getEDBAutomaticDisplayState(values, headers)'
          new = 'getEDBAutomaticDisplayState(values, headerMap)'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one incorrect lifecycle call; found {text.count(old)}')
          text = text.replace(old, new, 1)

          if text.count(needle) != 1:
              raise SystemExit('Repair failed: adapter definition count is not 1')
          if old in text:
              raise SystemExit('Repair failed: incorrect lifecycle call remains')
          if '1hHdFRgj1YnBqQATLd94iEGuRDqxOIsQEd8w1DKmYQfQ' in text:
              raise SystemExit('Repair failed: hard-coded production spreadsheet reference remains')

          path.write_text(text, encoding='utf-8')
          print('Step 8 source repair verified.')

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development-audit/EDB_DISPLAYBOARD_LIVE.js
          git rm .github/workflows/fix-step8-adapter.yml
          git commit -m "Fix Step 8 booking adapter"
          git push origin HEAD:${{ github.head_ref }}
