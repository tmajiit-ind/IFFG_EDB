name: Apply Step 8 source fix

on:
  push:
    branches:
      - fix/step8-dynamic-booking-test

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply Step 8 source fix') && !startsWith(github.event.head_commit.message, 'Remove temporary Step 8 patch workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/step8-dynamic-booking-test
          fetch-depth: 0

      - name: Apply and verify source fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('development-audit/EDB_DISPLAYBOARD_LIVE.js')
          s = p.read_text(encoding='utf-8')
          marker = 'function getEDBBookingForNewUI(bookingId) {'
          starts = [i for i in range(len(s)) if s.startswith(marker, i)]
          assert len(starts) == 2, f'Expected exactly 2 adapter definitions, found {len(starts)}'

          # Find the second function's matching closing brace while ignoring
          # braces inside strings and comments.
          start = starts[1]
          brace = s.index('{', start)
          i = brace
          depth = 0
          state = 'code'
          quote = ''
          while i < len(s):
              c = s[i]
              n = s[i + 1] if i + 1 < len(s) else ''
              if state == 'code':
                  if c == '/' and n == '/':
                      state = 'line_comment'; i += 2; continue
                  if c == '/' and n == '*':
                      state = 'block_comment'; i += 2; continue
                  if c in "'\"`":
                      quote = c; state = 'string'; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              elif state == 'string':
                  if c == '\\': i += 2; continue
                  if c == quote: state = 'code'
              elif state == 'line_comment':
                  if c == '\n': state = 'code'
              elif state == 'block_comment':
                  if c == '*' and n == '/': state = 'code'; i += 2; continue
              i += 1
          else:
              raise AssertionError('Could not locate end of duplicate adapter')

          duplicate = s[start:end]
          assert "SpreadsheetApp.openById" in duplicate
          assert "1hHdFRgj1YnBqQATLd94iEGuRDqxOIsQEd8w1DKmYQfQ" in duplicate
          assert "Advertisement Content" in duplicate
          s = s[:start] + s[end:]

          target = 'getEDBAutomaticDisplayState(values, headers)'
          assert s.count(target) == 1, f'Expected one bad lifecycle call, found {s.count(target)}'
          s = s.replace(target, 'getEDBAutomaticDisplayState(values, headerMap)', 1)

          assert s.count(marker) == 1, 'Duplicate adapter definition still present'
          assert s.count('getEDBAutomaticDisplayState(values, headerMap)') == 1
          assert "SpreadsheetApp.openById('1hHdFRgj1YnBqQATLd94iEGuRDqxOIsQEd8w1DKmYQfQ')" not in s
          p.write_text(s, encoding='utf-8')

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development-audit/EDB_DISPLAYBOARD_LIVE.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Apply Step 8 source fix'
          git push origin HEAD:fix/step8-dynamic-booking-test

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-step8-source-fix.yml
          git commit -m 'Remove temporary Step 8 patch workflow'
          git push origin HEAD:fix/step8-dynamic-booking-test
